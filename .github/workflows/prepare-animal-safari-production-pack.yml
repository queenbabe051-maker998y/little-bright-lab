name: Prepare Animal Sounds Safari Production Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/ANIMAL_SOUNDS_SAFARI_EPISODE_01.md"
      - "video/episode/episode_01.json"
      - "docs/CARTOON_WORLD_BIBLE.md"
      - ".github/workflows/prepare-animal-safari-production-pack.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production files
        uses: actions/checkout@v4

      - name: Validate scene timing and package contents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("video/episode/episode_01.json").read_text())
          assert manifest["runtime_seconds"] == 60
          assert len(manifest["scenes"]) == 5
          assert sum(s["duration"] for s in manifest["scenes"]) == 60
          expected = [10, 12, 13, 15, 10]
          actual = [s["duration"] for s in manifest["scenes"]]
          assert actual == expected, f"Unexpected scene timings: {actual}"
          print("Validated five-scene, 60-second episode.")
          PY
          mkdir -p production-pack
          cp docs/ANIMAL_SOUNDS_SAFARI_EPISODE_01.md production-pack/
          cp docs/CARTOON_WORLD_BIBLE.md production-pack/
          cp video/episode/episode_01.json production-pack/
          cat > production-pack/README.txt <<'EOF'
          The Little Bright Lab — Animal Sounds Safari, Episode 01
          This pack contains the approved storyboard, character continuity bible, and scene manifest.
          Use the same approved character reference images for every shot.
          Generate/animate the five scene clips using the prompts in the storyboard.
          GitHub Actions assembles supplied footage; it does not generate AI video by itself.
          EOF
          cd production-pack && zip -r ../little-bright-lab-animal-safari-production-pack.zip .

      - name: Upload production pack
        uses: actions/upload-artifact@v4
        with:
          name: little-bright-lab-animal-safari-production-pack
          path: little-bright-lab-animal-safari-production-pack.zip
          if-no-files-found: error
          retention-days: 14
