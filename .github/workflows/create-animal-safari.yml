name: Build The Little Bright Lab Cartoon World

on:
  workflow_dispatch:
  push:
    paths:
      - "video/**"
      - ".github/workflows/create-animal-safari.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip pillow numpy pydub edge-tts
      - name: Render The Little Bright Lab cartoon sampler
        run: python video/create_animal_safari.py
      - name: Upload animated MP4
        uses: actions/upload-artifact@v4
        with:
          name: little-bright-lab-cartoon-world
          path: output/little-bright-lab-cartoon-world.mp4
          if-no-files-found: error
          retention-days: 14
