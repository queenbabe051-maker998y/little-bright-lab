name: LEGACY Prototype Sampler (Not the Final 3D Episode)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Explain prototype limitations
        run: |
          echo "This workflow renders the older procedural sampler only."
          echo "It is not the polished 3D Animal Sounds Safari episode."
          echo "For the approved production package, run Prepare Animal Sounds Safari Production Pack."
          echo "For final assembly, run Assemble Animal Sounds Safari Episode 01 after supplying all five approved scene clips."
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip pillow numpy pydub edge-tts
      - name: Render legacy procedural prototype
        run: python video/create_animal_safari.py
      - name: Upload prototype MP4
        uses: actions/upload-artifact@v4
        with:
          name: legacy-procedural-prototype-not-final
          path: output/little-bright-lab-cartoon-world.mp4
          if-no-files-found: error
          retention-days: 14
