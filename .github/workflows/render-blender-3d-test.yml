name: Render Little Bright Lab 3D Motion Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg espeak-ng libegl1 libgl1 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6
      - name: Render original 3D scene
        env:
          LITTLE_BRIGHT_LAB_OUTPUT: output
        run: blender --background --threads 2 --python video/blender/create_motion_test.py
      - name: Create English voiceover and gentle background audio
        run: |
          mkdir -p output/audio
          espeak-ng -v en-us+f3 -s 145 -p 68 -a 165 -w output/audio/voiceover.wav "Hi, little explorers! Welcome to Little Bright Lab. Let's meet our animal friends!"
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=392:duration=8" -f lavfi -i "sine=frequency=523.25:duration=8" -filter_complex "[0:a]volume=0.025[a0];[1:a]volume=0.018[a1];[a0][a1]amix=inputs=2:duration=longest,afade=t=out:st=7:d=1[music]" -ar 44100 output/audio/music.wav
      - name: Encode 8-second MP4 with voiceover
        run: |
          ffmpeg -y -hide_banner -loglevel error -framerate 12 -i output/blender_frames/frame_%04d.png -i output/audio/voiceover.wav -i output/audio/music.wav \
            -filter_complex "[1:a]apad=pad_dur=8,atrim=0:8,volume=1.0[voice];[2:a]volume=0.7[music];[voice][music]amix=inputs=2:duration=first:dropout_transition=1[audio]" \
            -map 0:v:0 -map "[audio]" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 160k -t 8 -movflags +faststart \
            output/little-bright-lab-3d-motion-test.mp4
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: little-bright-lab-github-blender-3d-test
          path: |
            output/little-bright-lab-character-sheet.png
            output/little-bright-lab-3d-motion-test.mp4
          if-no-files-found: error
          retention-days: 14
